services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ctf_db
      POSTGRES_USER: ctf_user
      POSTGRES_PASSWORD: ctf_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf_user -d ctf_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "9999:3000"
    environment:
      DATABASE_URL: postgresql://ctf_user:ctf_password@postgres:5432/ctf_db
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    volumes:
    - .:/app
    - /app/node_modules
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .git/
            - .gitignore
            - Dockerfile*
        - action: rebuild
          path: package.json

volumes:
  postgres_data: